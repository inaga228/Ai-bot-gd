name: Build Geode Mod

on:
  push:
    branches: ["main"]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            target: Win64
          - os: ubuntu-latest
            target: Android64
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build mod (${{ matrix.target }})
        id: build
        uses: geode-sdk/build-geode-mod@main
        with:
          sdk: latest
          target: ${{ matrix.target }}

      - name: Upload artifact (${{ matrix.target }})
        uses: actions/upload-artifact@v4
        with:
          name: ai-level-bot-${{ matrix.target }}
          path: ${{ steps.build.outputs.build-output }}

  combine:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build combined geode package
        id: combine
        uses: geode-sdk/build-geode-mod/combine@main

      - name: Upload combined .geode
        uses: actions/upload-artifact@v4
        with:
          name: ai-level-bot-combined
          path: ${{ steps.combine.outputs.build-output }}
